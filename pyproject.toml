[project]
name = "valexii-aurex"
version = "0.0.1"
description = "External evidence, challenge, and evaluation engine for governed AI systems"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "VALEXII.AI"}]
dependencies = [
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
