[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valexii-aurex"
version = "0.1.0a1"
description = "External evidence, challenge, and evaluation engine for governed AI systems"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "VALEXII.AI"}]
dependencies = [
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "cryptography>=46.0.5,<47",
]

[project.scripts]
aurex = "aurex.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["aurex*"]

[tool.pytest.ini_options]
testpaths = ["tests", "training/tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
