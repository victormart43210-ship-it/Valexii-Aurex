name: CXXV website contract bridge

on:
  pull_request:
    paths:
      - ".github/workflows/cxxv-website-bridge.yml"
      - "website/src/lib/aurex-api-schema.ts"
      - "website/src/lib/aurex-cxxv-bridge.ts"
      - "website/src/components/aurex-cxxv-bridge.test.ts"
      - "website/docs/aurex-api/openapi.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/components/aurex-cxxv-bridge.test.ts
      - run: bun run build
