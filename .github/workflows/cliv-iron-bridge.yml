name: CLIV canonical towing and DISPATER
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy aurex
      - run: pytest -q
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: dispater-web
      - run: npm test
        working-directory: dispater-web
      - run: npm run build
        working-directory: dispater-web
