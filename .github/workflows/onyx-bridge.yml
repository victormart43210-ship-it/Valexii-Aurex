name: Onyx bridge synthetic contract
on:
  pull_request:
    paths:
      - 'aurex/integrations/onyx*.py'
      - 'aurex/api.py'
      - 'tests/test_onyx*.py'
      - '.github/workflows/onyx-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy aurex
      - run: python -m pytest -q
        env:
          AUREX_ONYX_LIVE_TEST: '0'
