name: AUREX Release Integrity Gate
on:
  push:
    branches:
      - main
      - aurex-mainline-convergence-*
  pull_request:

permissions:
  contents: read

jobs:
  verify-release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify release integrity
        run: python3 scripts/verify_release_integrity.py $(git rev-parse HEAD)
