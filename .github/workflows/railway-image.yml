name: Canonical Railway image
on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - aurex/**
      - training/**
      - workstation/**
      - .github/workflows/railway-image.yml
  workflow_dispatch:
jobs:
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical API image
        run: docker build --tag aurex-canonical:ci .
      - name: Verify non-root identity, health and SQLite volume access
        run: |
          set -euo pipefail
          mkdir -p "$(pwd)/ci-db"
          chmod 777 "$(pwd)/ci-db"
          docker run -d --name aurex-ci --user 10001:10001 -p 18080:8080 -v "$(pwd)/ci-db:/data" -e AUREX_DB_PATH=/data/aurex_jobs.db -e AUREX_SERVICE_TOKEN=0123456789abcdef0123456789abcdef -e AUREX_ENABLE_OFFLINE_LAB=0 aurex-canonical:ci
          trap 'docker logs aurex-ci; docker rm -f aurex-ci' EXIT
          # Health requires bearer authentication; anonymous requests must fail closed.
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer 0123456789abcdef0123456789abcdef" http://127.0.0.1:18080/v1/health; then break; fi
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer 0123456789abcdef0123456789abcdef" http://127.0.0.1:18080/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)" = 401
          test "$(docker exec aurex-ci id -u)" = 10001
          docker exec aurex-ci python -c 'from aurex.database import DEFAULT_DB_PATH, get_db; assert DEFAULT_DB_PATH == "/data/aurex_jobs.db"; c=get_db(); c.execute("select 1"); c.close()'
          test -f ci-db/aurex_jobs.db
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/jobs)" = 401
