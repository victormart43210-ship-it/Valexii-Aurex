name: AUREX Verified Release Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aurexctl"
      - "scripts/verify.sh"
      - ".github/workflows/aurex-release.yml"

permissions:
  contents: read

jobs:
  verified-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify clean tracked source
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD

      - name: Run full verification and package
        run: ./aurexctl package

      - name: Verify release checksum
        run: |
          cd releases
          sha256sum --check -- *.sha256

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurex-verified-source-${{ github.sha }}
          path: |
            releases/*.zip
            releases/*.sha256
          if-no-files-found: error
          retention-days: 30
