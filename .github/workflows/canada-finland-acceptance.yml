name: Canada Finland offline acceptance
on:
  push:
    paths: ['aurex/**', 'integrations/**', 'tests/**', 'acceptance/**', 'website/tests/**', 'pyproject.toml', '.github/workflows/canada-finland-acceptance.yml']
  pull_request:
    paths: ['aurex/**', 'integrations/**', 'tests/**', 'acceptance/**', 'website/tests/**', 'pyproject.toml', '.github/workflows/canada-finland-acceptance.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[dev]' -r acceptance/requirements.txt
      - run: python -m robot --outputdir /tmp/robot-results acceptance/canada_finland.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-robot-results
          path: /tmp/robot-results
          retention-days: 7
