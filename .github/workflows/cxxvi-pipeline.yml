name: AUREX CXXVI Pipeline Gate

on:
  pull_request:
    paths:
      - "aurex/api.py"
      - "aurex/pipeline_receipts.py"
      - "tests/test_cxxvi_pipeline_receipts.py"
      - "website/src/lib/aurex-api-schema.ts"
      - "website/src/lib/aurex-client.server.ts"
      - "website/src/components/aurex-cxxvi-pipeline.test.ts"
      - "website/docs/aurex-api/openapi.yaml"
      - "Dockerfile.aurex"
      - ".github/workflows/cxxvi-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: ruff check aurex/api.py aurex/pipeline_receipts.py tests/test_cxxvi_pipeline_receipts.py
      - run: mypy aurex
      - run: pytest -q tests/test_cxxvi_pipeline_receipts.py
      - run: pytest -q

  website-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/components/aurex-cxxvi-pipeline.test.ts
      - run: bun run build

  docker-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.aurex --tag aurex-cxxvi:local .
      - name: Verify auth and $0 disabled-by-default runtime
        run: |
          set -eu
          docker run -d --rm --name aurex-cxxvi -p 18775:8080 \
            -e AUREX_SERVICE_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            aurex-cxxvi:local
          trap 'docker logs aurex-cxxvi 2>&1 || true; docker rm -f aurex-cxxvi || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18775"
          auth = {"Authorization": "Bearer " + "a" * 40}
          for attempt in range(25):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as r:
                      assert json.load(r)["status"] == "ok"
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit("Candidate health failed")
          data = json.dumps({"kind": "regression_scan",
                             "params": {"probe": "sqlite_roundtrip_v1"},
                             "maxCostUsd": 0}).encode()
          req = urllib.request.Request(base + "/v1/jobs", method="POST", data=data,
                  headers={**auth, "Content-Type": "application/json",
                           "Idempotency-Key": "ci-disabled-probe-123"})
          try:
              urllib.request.urlopen(req, timeout=3)
          except urllib.error.HTTPError as e:
              assert e.code == 503, "offline lab must stay disabled"
          else:
              raise AssertionError("default-off worker erroneously executed")
          req = urllib.request.Request(base + "/v1/jobs",
                    headers={"Authorization": "Bearer invalid"})
          try:
              urllib.request.urlopen(req, timeout=3)
          except urllib.error.HTTPError as e:
              assert e.code == 401
          else:
              raise AssertionError("unauthenticated jobs exposed")
          print("CXXVI DOCKER_GATE_PASS; NO EFFECTS; $0")
          PY
